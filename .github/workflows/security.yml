  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependency-Check
        run: |
          VERSION=$(curl -s https://api.github.com/repos/dependency-check/DependencyCheck/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sL "https://github.com/dependency-check/DependencyCheck/releases/download/v${VERSION}/dependency-check-${VERSION}-release.zip" -o dc.zip
          unzip -q dc.zip
      - name: Run Dependency-Check
        run: ./dependency-check/bin/dependency-check.sh --project bootcamp-app --scan . --format HTML --out reports --failOnCVSS 7 --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports